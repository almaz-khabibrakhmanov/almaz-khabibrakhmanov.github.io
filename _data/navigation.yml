# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# NOTE that only one of the CV options should be selected, the first is for the
#      Markdown formatted page while the second is generated using JSON.

main:
  - title: "Research"
    url: /research/

  - title: "Publications"
    url: /publications/

  # CV sits third on purpose: the greedy nav folds later items into the
  # hamburger on narrow screens, and the CV is the page a hiring committee
  # reaches for first. Conferences is the one we can afford to have fold.
  - title: "CV"
    url: /cv/

  # - title: "CV"
  #   url: /cv-json/

  - title: "Conferences"
    url: /talks/

  - title: "Teaching"
    url: /teaching/

  - title: "Blog Posts"
    url: /year-archive/

  # Portfolio hidden from the header for now (page and collection still exist at
  # /portfolio/, just unlinked). Uncomment to bring it back.
  # - title: "Portfolio"
  #   url: /portfolio/
